[package]
name = "async-sse"
version = "5.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/http-rs/async-sse"
documentation = "https://docs.rs/async-sse"
description = "Async Server Sent Event parser and encoder"
readme = "README.md"
edition = "2018"
keywords = ["async", "server-sent-events", "sse", "client", "server"]
categories = []
authors = ["Renée Kooi <renee@kooi.me>", "Yoshua Wuyts <yoshuawuyts@gmail.com>"]

[features]

[dependencies]
futures-lite = "2.6.0"
http-types = { version = "2.12.0", default-features = false }
log = "0.4.27"
memchr = "2.7.5"
pin-project-lite = "0.2.16"
async-channel = "2.5.0"

[dev-dependencies]
femme = "2.2.1"
async-std = { version = "1.13.1", features = ["attributes", "unstable"] }
